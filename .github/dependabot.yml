version: 2

# Alerts were already firing on main — three high-severity advisories went
# unactioned because nothing opened a PR for them. This does.
#
# Scope is deliberately narrow: security updates open PRs immediately, while
# routine version bumps are grouped into one weekly PR. An ungrouped weekly
# flood of individual bumps is how a Dependabot config gets muted, and a muted
# config is worse than none.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Johannesburg
    open-pull-requests-limit: 5
    groups:
      # Everything non-breaking in one PR, reviewed once.
      #
      # This group is FIRST deliberately. Dependabot files an update into the
      # first group that matches it, and this one matches every package — so
      # minors and patches keep arriving as a single PR, and the lockstep groups
      # below only ever collect majors, which is the case they exist for.
      minor-and-patch:
        update-types:
          - minor
          - patch

      # ── LOCKSTEP FAMILIES ───────────────────────────────────────────────────
      #
      # Packages that are released together and MUST be upgraded together. Split
      # across separate PRs, each half is broken on its own: #594 bumped
      # @prisma/client to 7 and #595 bumped the prisma CLI to 7, and merging
      # either one alone leaves the client and the generator a major apart —
      # a broken build, from a green-looking PR.
      #
      # Only majors reach these groups (see above), which is exactly when a
      # family splits: a minor bump moves them together inside the weekly PR
      # anyway, but a major arrives per-package and needs recombining.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
        update-types:
          - major
      blocknote:
        patterns:
          - "@blocknote/*"
        update-types:
          - major
      tiptap:
        patterns:
          - "@tiptap/*"
        update-types:
          - major
      plate:
        patterns:
          - "platejs"
          - "@platejs/*"
        update-types:
          - major
      signpdf:
        patterns:
          - "@signpdf/*"
        update-types:
          - major
      simplewebauthn:
        patterns:
          - "@simplewebauthn/*"
        update-types:
          - major
      next:
        # `next` majors are ignored below, but eslint-config-next is pinned to
        # next's exact version, so its major must not arrive on its own.
        patterns:
          - "next"
          - "eslint-config-next"
        update-types:
          - major
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
    ignore:
      # Next major upgrades are a deliberate, tested migration — this repo runs
      # a Next version whose APIs differ from the defaults, so a bot PR bumping
      # the major would be noise. Security advisories still come through
      # regardless of this ignore.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # Native module — a major bump needs a real build to verify (sharp 0.34 →
      # 0.35 changed its package exports), so it is upgraded by hand.
      - dependency-name: sharp
        update-types: [version-update:semver-major]
      # @types/node is PINNED TO THE RUNTIME, not to the newest types.
      #
      # Both CI workflows pin node-version: 22, so the types are held at ^22 to
      # match — see the "//engines" note in package.json. Types ahead of the
      # runtime are worse than none: tsc stops flagging APIs the deployed Node
      # does not have, so the compiler goes quiet about exactly the calls that
      # would fail in production.
      #
      # Dependabot cannot read that reasoning, and opened #543 (22 → 26) which
      # failed with five TS2769 errors — the types disagreeing with the runtime,
      # not bugs to fix. Ignored here so the same PR does not keep returning.
      # RAISE THIS TOGETHER WITH node-version IN THE WORKFLOWS, never alone.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
