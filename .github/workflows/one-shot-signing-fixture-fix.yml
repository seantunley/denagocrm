name: One-shot signing fixture repair

on:
  push:
    branches:
      - feat/signing-engine-security-hardening
    paths:
      - .github/workflows/one-shot-signing-fixture-fix.yml

permissions:
  contents: write

jobs:
  patch-signing-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/signing-engine-security-hardening
          fetch-depth: 0

      - name: Align tenant-guard fixtures with digested signing tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/test-tenant-guard.ts")
          text = path.read_text(encoding="utf-8")

          import_anchor = '} from "../src/lib/tokenTenant";\nimport { resolveTenantActor'
          import_replacement = '} from "../src/lib/tokenTenant";\nimport { hashSignToken } from "../src/lib/signing/tokens";\nimport { resolveTenantActor'
          if text.count(import_anchor) != 1:
              raise SystemExit(f"unexpected tokenTenant import anchor count: {text.count(import_anchor)}")
          text = text.replace(import_anchor, import_replacement, 1)

          replacements = [
              ("token: signTokenA", "token: hashSignToken(signTokenA)", 2),
              ("token: signTokenB", "token: hashSignToken(signTokenB)", 1),
              ("token: apTokenA", "token: hashSignToken(apTokenA)", 1),
          ]
          for old, new, expected in replacements:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"unexpected occurrence count for {old!r}: expected {expected}, got {actual}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fixture repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-tenant-guard.ts
          git diff --cached --check
          git commit -m "Align tenant guard tests with hashed signing tokens"
          git push origin HEAD:feat/signing-engine-security-hardening
