name: CI — build, test & validate

# Runs on every pull request and on pushes to main. Previously this suite was
# path-filtered to security-related files, so most PRs merged with no automated
# checks at all. It now guards every change.
on:
  push:
    branches:
      - main
  # ready_for_review is included so a draft PR that is marked ready still runs
  # the suite; ordinary draft pushes are skipped by the job-level `if` below.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Only keep the newest run per branch/PR alive; a new push cancels the
# in-progress run instead of letting both burn Actions minutes to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Draft PRs skip the heavy suite; it runs once the PR is marked ready for
    # review (and always on push to main / manual dispatch).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: denago
          POSTGRES_PASSWORD: denago_test_password
          POSTGRES_DB: denagocrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denago -d denagocrm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://denago:denago_test_password@localhost:5432/denagocrm_test?schema=public
      DATABASE_URL_UNPOOLED: postgresql://denago:denago_test_password@localhost:5432/denagocrm_test?schema=public
      SESSION_SECRET: ci-session-secret-at-least-thirty-two-characters
      RATE_LIMIT_PEPPER: ci-rate-limit-pepper-at-least-thirty-two-characters
      SETTINGS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-cron-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NODE_ENV: test
      # Disposable credentials for the throwaway CI database. The seed no longer
      # hardcodes an owner, so provide one here (governance checks require an owner
      # / a user with roles.manage). NOT production secrets.
      INITIAL_ADMIN_EMAIL: ci-admin@example.invalid
      INITIAL_ADMIN_NAME: CI Administrator
      INITIAL_ADMIN_PASSWORD: ci-only-password-at-least-14-chars

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations (same unified script as preview & production)
        # scripts/apply-migrations.mjs is the exact command Vercel runs, so CI,
        # preview and production apply migrations identically — in true NUMERIC
        # order (Prisma's lexical `migrate deploy` mis-orders the non-zero-padded
        # prefixes: 10_dealer_signature before 4_quotes → "relation Quote does not
        # exist"). Running it here against a completely empty PostgreSQL IS the
        # shared empty-database migration test. It also runs each migration's
        # data-seeding INSERTs (RBAC in 52/53) the governance checks depend on.
        run: node scripts/apply-migrations.mjs

      - name: Migration replay-safety — re-apply the tenant migration (must be reentrant)
        # The runner executes a migration's SQL and records it with `migrate resolve`
        # as SEPARATE steps; if a deploy dies between them the next run re-executes
        # the SQL. Re-running the file here (it was already applied above) proves it
        # is idempotent DDL + data, so an interrupted deploy can't wedge the DB.
        run: npx prisma db execute --schema ./prisma --file prisma/migrations/20260721130000_tenant_foundation/migration.sql

      - name: Seed baseline data
        # governance + security checks also assert on a default pipeline + admin
        # user, which the seed provides on top of the migration-seeded RBAC rows.
        # `seed` lives under package.json#prisma.seed, so invoke via prisma.
        run: npx prisma db seed

      # A backup that quietly omits a column is worse than one that fails: one of
      # them you find out about. The exporter reads the table list from the
      # DATABASE and selects every column, so this asks the migrated schema
      # whether anything escaped the plan. It runs here, after migrations, because
      # a table added by a migration must be covered on the day it lands.
      - name: Backup covers every table and column
        run: npm run check:backup-coverage

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Production build is intentionally NOT run here: Vercel builds every PR
      # preview and push, so a duplicate CI build only burns Actions minutes.
      # Build breakage surfaces as a red Vercel check on the PR instead.

      - name: Verify governance invariants
        run: npm run verify:governance

      - name: Run security integration tests
        run: npm run test:security

      - name: Run RBAC integration tests
        # Cross-user visibility across leads, contacts, quotes, vehicles, job
        # cards, documents, cases and activities. Previously defined but never
        # executed by CI.
        run: npm run test:rbac

      - name: Run integrity / IDOR integration tests
        # Child-record IDOR scoping, reservation + dealer-signature state
        # transitions, the atomic OTP gate, and soft-delete on findUnique.
        run: npm run test:integrity

      - name: Signing upgrade test — migrate a database that ALREADY HAS signing data
        # The migration step above applies to a completely empty PostgreSQL, and
        # says so in its own comment. That cannot catch a backfill which skips
        # rows a previous migration already populated, a terminal-status trigger
        # whose write a later guard refuses, or an approval insert refused the
        # same way — all three shipped green because there was nothing to skip,
        # nothing completed and nothing approved.
        #
        # This runs against its OWN scratch database so the suites above keep the
        # schema they were seeded against. It applies the pre-signing migrations,
        # seeds a request with events and a legacy plaintext token, applies the
        # signing migrations onto that, and then performs the runtime transitions.
        # The scratch URL is DERIVED from the job's DATABASE_URL rather than
        # written out again. Two more literal connection strings — even to a
        # throwaway container — are two more things the secret scanner has to be
        # told to ignore, and an allowlist that grows for convenience stops being
        # a guard. Gitleaks flagged exactly that here.
        run: |
          admin="${DATABASE_URL%/*}/postgres"
          psql "$admin" -c 'DROP DATABASE IF EXISTS signing_upgrade'
          psql "$admin" -c 'CREATE DATABASE signing_upgrade'
          export DATABASE_URL="${DATABASE_URL%/*}/signing_upgrade"
          export DATABASE_URL_UNPOOLED="$DATABASE_URL"
          npm run test:signing-upgrade

      - name: Run tenant-guard integration tests
        # Phase C: the db.ts tenant guard with enforcement enabled — cross-tenant
        # read/update/delete refusal, write stamping, fail-closed on no scope,
        # system-scope bypass. Exercises the real Prisma extension, not just the
        # pure helpers.
        run: npm run test:tenant-guard

      - name: Run RLS proof under a restricted (NOSUPERUSER NOBYPASSRLS) role
        # The steps above connect as the container's bootstrap account, which is a
        # SUPERUSER and bypasses RLS entirely — so those isolation checks really
        # prove the app-layer guard. This step creates a NOSUPERUSER NOBYPASSRLS
        # role (what production uses), connects as it, and drives the REAL scoped
        # client so FORCE ROW LEVEL SECURITY itself is exercised.
        run: npm run test:rls-restricted

      - name: Run two-tenant end-to-end CRM isolation suite
        # Ordinary CRM flows (create a contact, tag it, open a support case) run as
        # two different tenants through the REAL scoped client under the restricted
        # role, asserting no cross-tenant read/update/delete and per-tenant tag
        # uniqueness — the regression guard for real-flow leakage, not just RLS
        # primitives.
        run: npm run test:tenant-e2e

      # THE SAFETY PROPERTY OF THIS PR, AND CI WAS NOT RUNNING IT.
      #
      # test:draft-concurrency was added to validate:security, which reads like
      # coverage and is not: this workflow does not run validate:security. It calls
      # the suites individually, so a script added only to that chain is never
      # executed by CI and its green tick means nothing about it.
      #
      # The test races two real draft claims against a real database. It is the
      # only thing that can show the read-then-write bug this PR fixes, so it has
      # to be run by the thing that gates the merge.
      - name: Concurrency -- two people cannot silently overwrite one reply draft
        run: npm run test:draft-concurrency

      # Two tenants, one shared phone number, one receipt. The structural tests can
      # assert that every query names a tenant; only a real database can show the
      # boundary holds. A phone number is not unique across tenants, which is what
      # made the unscoped version a cross-tenant WRITE rather than a leak.
      - name: Isolation -- a delivery receipt cannot reach another tenant
        run: npm run test:receipt-isolation
