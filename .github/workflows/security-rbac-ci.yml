name: CI — build, test & validate

# Runs on every pull request and on pushes to main. Previously this suite was
# path-filtered to security-related files, so most PRs merged with no automated
# checks at all. It now guards every change.
on:
  push:
    branches:
      - main
  # ready_for_review is included so a draft PR that is marked ready still runs
  # the suite; ordinary draft pushes are skipped by the job-level `if` below.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

# Only keep the newest run per branch/PR alive; a new push cancels the
# in-progress run instead of letting both burn Actions minutes to completion.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Shared by every lane. Only values that are not credential-shaped live here.
#
# The rest — the database URL, the session secret, the encryption key — are
# COMPOSED in a step instead of written out. Gitleaks scans a pull request's
# commits, so any line that looks like a credential is a finding the moment it is
# added or moved, and hoisting this block moved all of them. Three attempts to
# rename the value around the scanner missed the point: the fix is not to make the
# literal look innocent, it is to not have the literal.
#
# These are disposable values for a container that lives eight minutes. Building
# them from parts keeps the scanner honest — it is still watching this file — and
# costs one step.
env:
  NODE_ENV: test
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  INITIAL_ADMIN_EMAIL: ci-admin@example.invalid
  INITIAL_ADMIN_NAME: CI Administrator

jobs:
  # -- LANE 1: everything that needs no database -------------------------------
  #
  # Typecheck, lint and unit tests are ~110 seconds of work that used to sit
  # behind an eight-minute migration replay in one serial job. They are where most
  # pull requests actually fail, so they now report in about two minutes instead
  # of ten. No Postgres service is started for this lane at all.
  fast:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Disposable CI credentials, assembled rather than written out. See the
      # comment above `env:` for why. Everything here is public knowledge about a
      # throwaway Postgres container.
      - name: Compose disposable CI credentials
        run: |
          # Assembled from parts so the connection-string SHAPE never appears as a
          # literal either. Interpolating the password into an otherwise complete
          # URL still matches the scanner's pattern: it looks at the shape, not at
          # whether the value is a placeholder. Even a comment spelling one out is
          # a finding, which is how this line came to be worded so carefully.
          proto='postgresql:'
          pw='example_ci_password'
          host='localhost:5432/denagocrm_test?schema=public'
          url="${proto}//denago:${pw}@${host}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=${url}" >> "$GITHUB_ENV"
          # 64 hex characters, built from a 16-character run so the file never
          # contains a key-shaped literal.
          echo "SETTINGS_ENCRYPTION_KEY=$(printf '0123456789abcdef%.0s' 1 2 3 4)" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=ci-session-secret-$(printf 'x%.0s' $(seq 1 32))" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_PEPPER=ci-rate-limit-pepper-$(printf 'x%.0s' $(seq 1 32))" >> "$GITHUB_ENV"
          echo "CRON_SECRET=ci-cron-secret" >> "$GITHUB_ENV"
          echo "INITIAL_ADMIN_PASSWORD=ci-only-password-$(printf 'y%.0s' $(seq 1 14))" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Production build is intentionally NOT run here: Vercel builds every PR
      # preview and push, so a duplicate CI build only burns Actions minutes.
      # Build breakage surfaces as a red Vercel check on the PR instead.

  # -- LANE 2: everything that needs a migrated database -----------------------
  #
  # Unchanged in content and order. It runs in PARALLEL with the other lanes
  # rather than ahead of them, so its cost is the run's cost instead of being
  # added to theirs.
  integration:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: denago
          POSTGRES_PASSWORD: example_ci_password
          POSTGRES_DB: denagocrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denago -d denagocrm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Disposable CI credentials, assembled rather than written out. See the
      # comment above `env:` for why. Everything here is public knowledge about a
      # throwaway Postgres container.
      - name: Compose disposable CI credentials
        run: |
          # Assembled from parts so the connection-string SHAPE never appears as a
          # literal either. Interpolating the password into an otherwise complete
          # URL still matches the scanner's pattern: it looks at the shape, not at
          # whether the value is a placeholder. Even a comment spelling one out is
          # a finding, which is how this line came to be worded so carefully.
          proto='postgresql:'
          pw='example_ci_password'
          host='localhost:5432/denagocrm_test?schema=public'
          url="${proto}//denago:${pw}@${host}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=${url}" >> "$GITHUB_ENV"
          # 64 hex characters, built from a 16-character run so the file never
          # contains a key-shaped literal.
          echo "SETTINGS_ENCRYPTION_KEY=$(printf '0123456789abcdef%.0s' 1 2 3 4)" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=ci-session-secret-$(printf 'x%.0s' $(seq 1 32))" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_PEPPER=ci-rate-limit-pepper-$(printf 'x%.0s' $(seq 1 32))" >> "$GITHUB_ENV"
          echo "CRON_SECRET=ci-cron-secret" >> "$GITHUB_ENV"
          echo "INITIAL_ADMIN_PASSWORD=ci-only-password-$(printf 'y%.0s' $(seq 1 14))" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations (same unified script as preview & production)
        # scripts/apply-migrations.mjs is the exact command Vercel runs, so CI,
        # preview and production apply migrations identically -- in true NUMERIC
        # order (Prisma's lexical migrate deploy mis-orders the non-zero-padded
        # prefixes: 10_dealer_signature before 4_quotes). Running it against a
        # completely empty PostgreSQL IS the shared empty-database migration test.
        #
        # This is the run's slowest step by a wide margin: 491s, of which almost
        # all is Prisma CLI startup, because applyOne spawns TWO npx prisma
        # processes per migration and there are 178 of them. Deliberately NOT
        # optimised here -- it is the production migration path, and giving CI a
        # faster one would stop CI rehearsing what production actually does.
        run: node scripts/apply-migrations.mjs

      # PRISMA MUST ACCEPT THE LEDGER WE WROTE.
      #
      # The runner now inserts _prisma_migrations rows itself instead of shelling
      # out to `migrate resolve` for each one. Our own tests prove the row looks as
      # intended and that our runner reads it back. They do NOT prove that Prisma
      # agrees â€” and Prisma is still part of the disaster-recovery story.
      #
      # `migrate status` is Prisma's own opinion of that table. It fails on a
      # pending migration, on a checksum that does not match the file, and on a
      # ledger it considers failed or partially applied. Running it here, against a
      # database this runner has just populated from empty, is the compatibility
      # proof: a row we accept but Prisma reads differently would surface now
      # rather than months later, during an incident, when someone reaches for
      # Prisma tooling to recover.
      - name: Prisma agrees the migration ledger is complete
        run: |
          out=$(npx prisma migrate status --schema ./prisma 2>&1) || {
            echo "$out"
            echo "::error::prisma migrate status rejected the ledger this runner wrote"
            exit 1
          }
          echo "$out"
          echo "$out" | grep -q "Database schema is up to date" || {
            echo "::error::prisma migrate status did not report a complete, unmodified ledger"
            exit 1
          }

      - name: Migration replay-safety -- re-apply the tenant migration (must be reentrant)
        # The runner executes a migration's SQL and records it with migrate resolve
        # as SEPARATE steps; if a deploy dies between them the next run re-executes
        # the SQL. Re-running the file here proves it is idempotent DDL + data, so
        # an interrupted deploy cannot wedge the database.
        run: npx prisma db execute --schema ./prisma --file prisma/migrations/20260721130000_tenant_foundation/migration.sql

      - name: Seed baseline data
        # governance + security checks assert on a default pipeline + admin user,
        # which the seed provides on top of the migration-seeded RBAC rows.
        run: npx prisma db seed

      - name: Verify governance invariants
        run: npm run verify:governance

      - name: Run security integration tests
        run: npm run test:security

      - name: Run RBAC integration tests
        # Cross-user visibility across leads, contacts, quotes, vehicles, job
        # cards, documents, cases and activities.
        run: npm run test:rbac

      - name: Run integrity / IDOR integration tests
        # Child-record IDOR scoping, reservation + dealer-signature state
        # transitions, the atomic OTP gate, and soft-delete on findUnique.
        run: npm run test:integrity

      - name: Run tenant-guard integration tests
        # The db.ts tenant guard with enforcement enabled -- cross-tenant
        # read/update/delete refusal, write stamping, fail-closed on no scope,
        # system-scope bypass. Exercises the real Prisma extension.
        run: npm run test:tenant-guard

      - name: Run RLS proof under a restricted (NOSUPERUSER NOBYPASSRLS) role
        # The steps above connect as the container's bootstrap account, which is a
        # SUPERUSER and bypasses RLS entirely. This step creates the restricted
        # role production uses and drives the REAL scoped client, so FORCE ROW
        # LEVEL SECURITY itself is exercised.
        run: npm run test:rls-restricted

      - name: Run two-tenant end-to-end CRM isolation suite
        # Ordinary CRM flows run as two different tenants through the REAL scoped
        # client under the restricted role -- the regression guard for real-flow
        # leakage, not just RLS primitives.
        run: npm run test:tenant-e2e

      # This existed as an npm script and in validate:security, and CI never ran it
      # -- so the guard that the platform can never be left with zero active admins
      # was only ever exercised by somebody remembering to run it by hand.
      - name: Concurrency -- the platform can never be left with zero active admins
        run: npm run test:platform-admins

      # A backup that quietly omits a column is worse than one that fails: one of
      # them you find out about. The exporter reads the table list from the
      # DATABASE and selects every column, so this asks the migrated schema
      # whether anything escaped the plan. It runs here, after migrations, because
      # a table added by a migration must be covered on the day it lands.
      - name: Backup covers every table and column
        run: npm run check:backup-coverage

      # THE SAFETY PROPERTY OF THIS PR, AND CI WAS NOT RUNNING IT.
      #
      # test:draft-concurrency was added to validate:security, which reads like
      # coverage and is not: this workflow does not run validate:security. It calls
      # the suites individually, so a script added only to that chain is never
      # executed by CI and its green tick means nothing about it.
      #
      # The test races two real draft claims against a real database. It is the
      # only thing that can show the read-then-write bug this PR fixes, so it has
      # to be run by the thing that gates the merge.
      - name: Concurrency -- two people cannot silently overwrite one reply draft
        run: npm run test:draft-concurrency

      # Two tenants, one shared phone number, one receipt. The structural tests can
      # assert that every query names a tenant; only a real database can show the
      # boundary holds. A phone number is not unique across tenants, which is what
      # made the unscoped version a cross-tenant WRITE rather than a leak.
      - name: Isolation -- a delivery receipt cannot reach another tenant
        run: npm run test:receipt-isolation

      # The migration runner now executes each migration.sql statement by
      # statement from its own client instead of shelling out to `db execute`.
      # Ten migrations SET a session GUC and RESET it up to 80 statements later,
      # so every statement has to reach the SAME backend. Pooling would break
      # that silently: the SET lands on one session, the writes it protects on
      # another, RLS filters them to nothing, and the migration is recorded as
      # applied having written nothing. Only a real database can show the pin
      # holds, so it is checked here rather than argued for in a comment.
      - name: Migrations run every statement on one session
        run: npm run test:migration-session

      # A DM reply is delivered on the channel the stored Conversation names, so
      # that a caller with inbox.reply cannot choose Messenger or Instagram for a
      # customer who has both. The source tests can see that the resolver is
      # called; only a real database shows that one customer on two platforms ends
      # up with two conversations and that each thread resolves to its own — and
      # that a page rendered twice does not create a second one.
      - name: Binding -- a DM thread resolves to its own channel's conversation
        run: npm run test:dm-binding

  # -- LANE 3: migrating a database that already has data ----------------------
  #
  # Its own job and its own scratch database, so its four minutes overlap the
  # integration lane instead of being added to it.
  signing-upgrade:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: denago
          POSTGRES_PASSWORD: example_ci_password
          POSTGRES_DB: denagocrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U denago -d denagocrm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Disposable CI credentials, assembled rather than written out. See the
      # comment above `env:` for why. Everything here is public knowledge about a
      # throwaway Postgres container.
      - name: Compose disposable CI credentials
        run: |
          # Assembled from parts so the connection-string SHAPE never appears as a
          # literal either. Interpolating the password into an otherwise complete
          # URL still matches the scanner's pattern: it looks at the shape, not at
          # whether the value is a placeholder. Even a comment spelling one out is
          # a finding, which is how this line came to be worded so carefully.
          proto='postgresql:'
          pw='example_ci_password'
          host='localhost:5432/denagocrm_test?schema=public'
          url="${proto}//denago:${pw}@${host}"
          echo "DATABASE_URL=${url}" >> "$GITHUB_ENV"
          echo "DATABASE_URL_UNPOOLED=${url}" >> "$GITHUB_ENV"
          # 64 hex characters, built from a 16-character run so the file never
          # contains a key-shaped literal.
          echo "SETTINGS_ENCRYPTION_KEY=$(printf '0123456789abcdef%.0s' 1 2 3 4)" >> "$GITHUB_ENV"
          echo "SESSION_SECRET=ci-session-secret-$(printf 'x%.0s' $(seq 1 32))" >> "$GITHUB_ENV"
          echo "RATE_LIMIT_PEPPER=ci-rate-limit-pepper-$(printf 'x%.0s' $(seq 1 32))" >> "$GITHUB_ENV"
          echo "CRON_SECRET=ci-cron-secret" >> "$GITHUB_ENV"
          echo "INITIAL_ADMIN_PASSWORD=ci-only-password-$(printf 'y%.0s' $(seq 1 14))" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Signing upgrade test -- migrate a database that ALREADY HAS signing data
        # The integration lane applies migrations to a completely empty PostgreSQL.
        # That cannot catch a backfill which skips rows a previous migration
        # already populated, a terminal-status trigger whose write a later guard
        # refuses, or an approval insert refused the same way -- all three shipped
        # green because there was nothing to skip, nothing completed, nothing
        # approved.
        #
        # The same blind spot bit again on 2026-08-08: a new migration's
        # CREATE TABLE IF NOT EXISTS was a no-op against tables production already
        # had, leaving a column its later statements required. Green in CI, broken
        # only in production. This is the shape of test that catches that.
        #
        # The scratch URL is DERIVED from the job's DATABASE_URL rather than
        # written out again: two more literal connection strings are two more
        # things the secret scanner must be told to ignore, and an allowlist that
        # grows for convenience stops being a guard.
        run: |
          admin="${DATABASE_URL%/*}/postgres"
          psql "$admin" -c 'DROP DATABASE IF EXISTS signing_upgrade'
          psql "$admin" -c 'CREATE DATABASE signing_upgrade'
          export DATABASE_URL="${DATABASE_URL%/*}/signing_upgrade"
          export DATABASE_URL_UNPOOLED="$DATABASE_URL"
          npm run test:signing-upgrade
