name: Secret scan

# A production database password and a GitHub PAT were once pasted into a chat
# transcript. They never reached the repository — .env* is gitignored and no
# tracked file has ever carried a credential — but nothing was checking. This
# does, on every push and pull request.
#
# The gate lives in CI rather than a local hook on purpose: a pre-commit hook
# only protects the machines that installed it, and gitleaks is not on the
# Windows dev box. `npm run hooks:install` adds the local hook for fast
# feedback; this workflow is what actually enforces it.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret committed and then "removed" in a later commit
          # is still in the objects, and still valid until it is rotated. Depth 1
          # would scan only the tip and call that clean.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # Findings belong in the job log, not in a public artifact.
          GITLEAKS_ENABLE_SUMMARY: "true"
