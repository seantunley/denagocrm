name: Visual consistency

on:
  pull_request:
    paths:
      - "src/app/**"
      - "src/components/**"
      - "scripts/check-visual-consistency.mjs"
      - ".github/workflows/visual-consistency.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check visual consistency
        run: node scripts/check-visual-consistency.mjs
