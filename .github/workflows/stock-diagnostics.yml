name: Stock branch diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --silent
      - run: npx prisma generate >/dev/null
      - name: Capture TypeScript diagnostics
        id: typecheck
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --pretty false > typecheck.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: stock-typecheck-diagnostics
          path: typecheck.log
          if-no-files-found: error
      - name: Fail when typecheck failed
        if: steps.typecheck.outputs.exit_code != '0'
        run: |
          cat typecheck.log
          exit 1
