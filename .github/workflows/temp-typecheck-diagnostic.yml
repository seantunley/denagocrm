name: Temporary typecheck diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  typecheck-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - run: npm ci --silent
      - name: Capture TypeScript output
        run: npm run typecheck > typecheck.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck.txt
