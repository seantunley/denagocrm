name: Temporary lint diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint-location-autocomplete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - run: npm ci --silent
      - run: npx eslint src/components/LocationAutocomplete.tsx
