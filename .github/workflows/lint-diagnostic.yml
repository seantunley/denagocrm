name: Temporary lint diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint-location-autocomplete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - run: npm ci --silent
      - name: Capture ESLint report
        id: lint
        continue-on-error: true
        run: npx eslint src/components/LocationAutocomplete.tsx > lint-report.txt 2>&1
      - uses: actions/upload-artifact@v4
        with:
          name: location-autocomplete-lint
          path: lint-report.txt
      - name: Fail when lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
