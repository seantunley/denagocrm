# gitleaks configuration — see .github/workflows/secret-scan.yml
#
# Extends the maintained default ruleset rather than replacing it, so new
# provider patterns arrive with gitleaks upgrades instead of rotting here.
[extend]
useDefault = true

# Two credentials this project actually handles, which the default rules do not
# cover specifically: Neon's Postgres role passwords and any pasted connection
# string. Both are the exact shapes that leaked into a chat transcript.
[[rules]]
id = "neon-postgres-password"
description = "Neon Postgres role password (npg_ prefix)"
regex = '''npg_[A-Za-z0-9]{16,}'''
tags = ["database", "neon"]

[[rules]]
id = "postgres-connection-string"
description = "Postgres connection string with inline credentials"
regex = '''postgres(?:ql)?://[^\s:@/]+:[^\s:@/]+@[^\s/]+'''
tags = ["database"]

  # A connection string whose host is LOOPBACK, in the tenant-isolation
  # harness's own provisioning module.
  #
  # WHY THIS IS NOT A HOLE. The credentials are `harness:harness` on
  # 127.0.0.1, against a database this repository creates, migrates from empty
  # and drops on every run. There is no remote to reach with them: a loopback
  # address is only ever the machine already running the scanner. The
  # allowlist requires the loopback host to sit IMMEDIATELY after the `@` and
  # be followed by a port or nothing, so `…@localhost.example.com/db` — a real
  # remote wearing a local-looking prefix — is still reported. Anything with a
  # routable host in this same file is still reported too.
  #
  # WHY IT EXISTS AT ALL, given the source no longer contains this shape.
  # scripts/harness/testDatabase.ts now composes its URLs from parts
  # (PG_SCHEME + user + host + port), so no `postgres://user:pass@host` text
  # appears in the working tree and future edits cannot reintroduce the finding
  # by accident. But this workflow scans GIT HISTORY — on a pull request,
  # `--log-opts=…{first PR commit}^..{head}` — and the harness's first commit
  # already contains the un-composed literals. History is immutable, so no
  # amount of fixing the tip clears them. This is what does.
  #
  # Deliberately NOT .gitleaksignore fingerprints: those are
  # `commit:file:rule:line`, so they die the moment the branch is rebased or
  # squash-merged, and they would have to be regenerated by hand for every
  # future local URL. A rule scoped by shape rots on nothing.
  [rules.allowlist]
  description = "Loopback-only scratch database URLs in the isolation harness"
  paths = ['''scripts/harness/testDatabase\.ts''']
  regexes = ['''postgres(?:ql)?://[^\s:@/]+:[^\s:@/]+@(?:127\.0\.0\.1|\[::1\]|localhost|host\.docker\.internal)(?::|$)''']
  # Both must hold: the right file AND the loopback shape. Without this the
  # criteria are ORed and `paths` alone would exempt the entire file.
  condition = "AND"

[allowlist]
description = "Paths that legitimately contain credential-shaped text"
paths = [
  # Lockfiles carry integrity hashes that trip entropy rules.
  '''package-lock\.json''',
  '''pnpm-lock\.yaml''',
]
regexes = [
  # Documented placeholders, not secrets.
  '''postgres(?:ql)?://(?:user|username|USER|<[^>]+>):(?:pass|password|PASSWORD|<[^>]+>)@''',
  '''(?i)(example|placeholder|redacted|your[-_]?(key|token|secret))''',
]
